[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "inkbridge"
version = "0.0.0"
description = "Scaffold for photo to editable Goodnotes ink"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic>=2.8,<3", "PyYAML>=6,<7", "python-dotenv>=1,<2", "typer>=0.12,<1", "rich>=13,<15"]

[project.optional-dependencies]
image = ["numpy>=1.26,<3", "Pillow>=10,<13", "opencv-python-headless>=4.9,<5", "scipy>=1.13,<2", "scikit-image>=0.23,<1", "pypdfium2>=4.30,<6"]
optimization = ["numpy>=1.26,<3", "scipy>=1.13,<2", "cma>=4,<5"]
training = ["torch>=2.4,<3"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "mypy>=1.11,<2"]

[project.scripts]
inkbridge = "inkbridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inkbridge"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["inkbridge"]
check_untyped_defs = true

